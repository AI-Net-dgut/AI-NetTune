<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 860" width="1100" height="860" role="img" aria-label="AI-NetTune 技术架构图">
  <defs>
    <linearGradient id="llmBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaf4ff"/>
      <stop offset="1" stop-color="#d6e9ff"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b7c99"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1685ff"/>
    </marker>
    <style>
      .layer  { fill: #f7fafc; stroke: #c3d4e4; stroke-width: 1.6; }
      .title  { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; font-size: 22px; font-weight: 700; fill: #12283d; }
      .detail { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; font-size: 17px; fill: #40586f; }
      .mono   { font-family: Consolas, "Courier New", monospace; font-size: 16px; fill: #40586f; }
      .edge   { stroke: #5b7c99; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .edgeB  { stroke: #1685ff; stroke-width: 2.4; fill: none; }
      .lab    { font-family: "Microsoft YaHei", sans-serif; font-size: 15px; fill: #3f6484; }
    </style>
  </defs>

  <rect width="1100" height="860" fill="#ffffff"/>
  <text x="40" y="46" class="title">AI-NetTune 分层架构（依赖单向向下）</text>
  <text x="40" y="74" class="detail">上层不直接读 CSV；LLM 层贯穿全流程，任一层失败只降级该层</text>

  <!-- ① 浏览器 -->
  <rect class="layer" x="70" y="100" width="620" height="86" rx="10"/>
  <text x="94" y="134" class="title">浏览器</text>
  <text x="94" y="164" class="detail">React 19 · TypeScript · ECharts（趋势 / 热力 / 拓扑 / 序列态势）</text>

  <!-- ② FastAPI -->
  <rect class="layer" x="70" y="222" width="620" height="86" rx="10"/>
  <text x="94" y="256" class="title">FastAPI 路由层</text>
  <text x="94" y="286" class="detail">17 个业务接口 · 统一错误码 · 限流 · 超时</text>

  <!-- ③ 工具体层 -->
  <rect class="layer" x="70" y="344" width="620" height="104" rx="10"/>
  <text x="94" y="378" class="title">工具体层</text>
  <text x="94" y="406" class="mono">query_kpi · fault_diagnosis · get_heatmap</text>
  <text x="94" y="432" class="mono">get_topology · forecast · chat</text>

  <!-- ★ LLM 层 -->
  <rect x="750" y="330" width="310" height="240" rx="12" fill="url(#llmBg)" stroke="#1685ff" stroke-width="2.6"/>
  <rect x="750" y="330" width="310" height="42" rx="12" fill="#1685ff"/>
  <rect x="750" y="356" width="310" height="16" fill="#1685ff"/>
  <text x="905" y="359" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#ffffff">★ LLM 层（本平台核心）</text>
  <text x="772" y="404" class="detail">① 意图识别：规则优先、模型兜底</text>
  <text x="772" y="436" class="detail">② 回答生成：基于已算好的证据</text>
  <text x="772" y="468" class="detail">③ harness 校验：9 条</text>
  <text x="772" y="500" class="detail">④ 不通过 → 重写 ≤3 次</text>
  <text x="772" y="532" class="detail">⑤ 仍不通过 → 退回规则文案</text>

  <!-- ④ 模型层 -->
  <rect class="layer" x="70" y="490" width="620" height="118" rx="10"/>
  <text x="94" y="524" class="title">模型层</text>
  <text x="94" y="552" class="detail">阈值判据（40/50 频段 · 连续 3 分钟）· plan_model（方案与仿真）</text>
  <text x="94" y="580" class="mono">forecast_model（Prophet，失败降级移动平均）· spatial_model（Kriging，失败降级网格均值）</text>

  <!-- ⑤ 数据层 -->
  <rect class="layer" x="70" y="648" width="620" height="118" rx="10"/>
  <text x="94" y="682" class="title">数据层</text>
  <text x="94" y="710" class="mono">network_data_30d.csv · spectrum_7d.csv · fault_events.csv</text>
  <text x="94" y="738" class="detail">启动读入内存 + 时间戳二分索引；原始数据只读，仿真偏移在读取时叠加</text>

  <!-- 主链路箭头 -->
  <path class="edge" d="M380 186 L380 218"/>
  <path class="edge" d="M380 308 L380 340"/>
  <path class="edge" d="M380 448 L380 486"/>
  <path class="edge" d="M380 608 L380 644"/>

  <!-- 工具层 <-> LLM -->
  <path d="M690 372 L744 372" stroke="#1685ff" stroke-width="2.4" fill="none" marker-end="url(#arrowBlue)"/>
  <path d="M744 412 L690 412" stroke="#1685ff" stroke-width="2.4" fill="none" marker-end="url(#arrowBlue)"/>
  <text x="700" y="362" class="lab">证据包</text>
  <text x="700" y="436" class="lab">解释 / 意图</text>

  <!-- 侧注 -->
  <text x="750" y="612" class="detail">降级链：LLM 不可用 → 规则文案；</text>
  <text x="750" y="638" class="detail">Prophet 不可用 → 移动平均；</text>
  <text x="750" y="664" class="detail">Kriging 不可用 → 网格均值。</text>
  <text x="750" y="700" class="detail">每层降级在界面与返回字段如实标注。</text>

  <!-- 数据范围脚注 -->
  <text x="70" y="812" class="lab">数据范围：网络表 01-01 ~ 01-30（129,600 条）；频谱表 01-01 ~ 01-07（1,512,000 条）；系统支撑范围取交集 01-01 ~ 01-07 23:59。</text>
</svg>
