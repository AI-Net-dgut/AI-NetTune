<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 900" width="1120" height="900" role="img" aria-label="AI-NetTune 技术架构图">
  <defs>
    <linearGradient id="llmBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef6ff"/>
      <stop offset="1" stop-color="#d8eaff"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b7c99"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1685ff"/>
    </marker>
    <style>
      .box    { fill: #f8fbfd; stroke: #c3d4e4; stroke-width: 1.6; }
      .h      { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; font-size: 21px; font-weight: 700; fill: #12283d; }
      .t      { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; font-size: 16px; fill: #40586f; }
      .m      { font-family: Consolas, "Courier New", monospace; font-size: 15px; fill: #40586f; }
      .lab    { font-family: "Microsoft YaHei", sans-serif; font-size: 14px; fill: #3f6484; }
      .edge   { stroke: #5b7c99; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1120" height="900" fill="#ffffff"/>
  <text x="50" y="44" class="h">AI-NetTune 分层架构（依赖单向向下）</text>
  <text x="50" y="72" class="t">上层不直接读 CSV；LLM 层贯穿全流程，任一层失败只降级该层</text>

  <!-- 左列：五层 -->
  <rect class="box" x="50" y="96" width="600" height="80" rx="10"/>
  <text x="72" y="128" class="h">浏览器</text>
  <text x="72" y="156" class="t">React 19 · TypeScript · ECharts（趋势 / 热力 / 拓扑 / 序列态势）</text>

  <rect class="box" x="50" y="212" width="600" height="80" rx="10"/>
  <text x="72" y="244" class="h">FastAPI 路由层</text>
  <text x="72" y="272" class="t">17 个业务接口 · 统一错误码 · 限流 · 超时</text>

  <rect class="box" x="50" y="328" width="600" height="104" rx="10"/>
  <text x="72" y="360" class="h">工具体层</text>
  <text x="72" y="388" class="m">query_kpi · fault_diagnosis · get_heatmap</text>
  <text x="72" y="412" class="m">get_topology · forecast · chat</text>

  <rect class="box" x="50" y="468" width="600" height="116" rx="10"/>
  <text x="72" y="500" class="h">模型层</text>
  <text x="72" y="528" class="t">阈值判据（40/50 频段 · 连续 3 分钟）</text>
  <text x="72" y="552" class="t">plan_model（方案仿真）· forecast_model（Prophet）</text>
  <text x="72" y="574" class="t">spatial_model（Kriging）</text>

  <rect class="box" x="50" y="620" width="600" height="140" rx="10"/>
  <text x="72" y="650" class="h">数据层</text>
  <text x="72" y="678" class="m">network_data_30d.csv · spectrum_7d.csv</text>
  <text x="72" y="700" class="t">fault_events.csv（事件级验收真值）</text>
  <text x="72" y="724" class="t">启动读入内存 + 时间戳二分索引；原始数据只读</text>
  <text x="72" y="746" class="t">仿真偏移在读取时叠加，不改原始文件</text>

  <!-- 主链路 -->
  <path class="edge" d="M350 176 L350 208"/>
  <path class="edge" d="M350 292 L350 324"/>
  <path class="edge" d="M350 432 L350 464"/>
  <path class="edge" d="M350 584 L350 616"/>

  <!-- LLM 层：右移，与工具体层之间留 90px 放箭头标签 -->
  <rect x="740" y="300" width="360" height="256" rx="12" fill="url(#llmBg)" stroke="#1685ff" stroke-width="2.6"/>
  <rect x="740" y="300" width="360" height="42" rx="12" fill="#1685ff"/>
  <rect x="740" y="326" width="360" height="16" fill="#1685ff"/>
  <text x="920" y="329" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="700" fill="#ffffff">★ LLM 层（本平台核心）</text>
  <text x="762" y="376" class="t">① 意图识别：规则优先，模型兜底</text>
  <text x="762" y="404" class="t">② 回答生成：只用已算好的证据</text>
  <text x="762" y="432" class="t">③ harness 校验：9 条规则</text>
  <text x="762" y="460" class="t">④ 不通过 → 重写 ≤3 次</text>
  <text x="762" y="488" class="t">⑤ 仍不通过 → 退回规则文案</text>
  <text x="762" y="524" class="lab">失败原因在界面「AI 文本状态」可查</text>

  <!-- 工具层 ↔ LLM：箭头在两个方框之间的留白里，标签居中于留白 -->
  <path d="M656 358 L734 358" stroke="#1685ff" stroke-width="2.4" fill="none" marker-end="url(#arrowBlue)"/>
  <path d="M734 400 L656 400" stroke="#1685ff" stroke-width="2.4" fill="none" marker-end="url(#arrowBlue)"/>
  <text x="695" y="348" text-anchor="middle" class="lab">证据包</text>
  <text x="695" y="424" text-anchor="middle" class="lab">解释 / 意图</text>

  <!-- 右侧降级链 -->
  <text x="740" y="592" class="t">降级链（每层在界面与返回字段如实标注）：</text>
  <text x="740" y="618" class="t">· LLM 不可用 → 规则文案</text>
  <text x="740" y="642" class="t">· Prophet 不可用 → 移动平均</text>
  <text x="740" y="666" class="t">· Kriging 不可用 → 网格均值</text>

  <!-- 脚注 -->
  <text x="50" y="818" class="lab">数据范围：网络表 01-01 ~ 01-30（129,600 条）；频谱表 01-01 ~ 01-07（1,512,000 条）；</text>
  <text x="50" y="842" class="lab">系统支撑范围取交集 01-01 ~ 01-07 23:59，越界查询返回 insufficient_data。</text>
</svg>
