<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="AI-NetTune 组织头像 v2">
  <defs>
    <linearGradient id="navy" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#22344a"/>
      <stop offset="0.6" stop-color="#16222f"/>
      <stop offset="1" stop-color="#0c141d"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.42" cy="0.34" r="0.8">
      <stop offset="0" stop-color="#4ec3e0" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#4ec3e0" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="c"><circle cx="256" cy="256" r="256"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="512" height="512" fill="url(#navy)"/>
    <rect width="512" height="512" fill="url(#halo)"/>

    <!-- 主体：三节点拓扑 + 双弧（右侧辐射，左右各一避免"分享"误读） -->
    <g transform="translate(236 250)">
      <!-- 连线 -->
      <path d="M-96 -96 L44 0 M-96 96 L44 0" stroke="#eaf2fb" stroke-width="34" stroke-linecap="round"/>
      <!-- 节点 -->
      <circle cx="-100" cy="-100" r="44" fill="#eaf2fb"/>
      <circle cx="-100" cy="100" r="44" fill="#eaf2fb"/>
      <circle cx="48" cy="0" r="50" fill="#eaf2fb"/>
      <!-- 双弧：表示无线辐射（右强左弱，避免对称呆板） -->
      <path d="M116 -66 Q168 0 116 66" fill="none" stroke="#4ec3e0" stroke-width="26" stroke-linecap="round"/>
      <path d="M158 -104 Q228 0 158 104" fill="none" stroke="#4ec3e0" stroke-opacity="0.45" stroke-width="20" stroke-linecap="round"/>
      <path d="M-158 -70 Q-196 0 -158 70" fill="none" stroke="#4ec3e0" stroke-opacity="0.35" stroke-width="18" stroke-linecap="round"/>
    </g>

    <!-- AI 角标 -->
    <g transform="translate(348 372)">
      <rect x="0" y="0" width="120" height="66" rx="18" fill="#0b1a26" stroke="#4ec3e0" stroke-width="3"/>
      <text x="60" y="46" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif"
            font-size="38" font-weight="700" fill="#7fdcf2" letter-spacing="2">AI</text>
    </g>
  </g>
  <circle cx="256" cy="256" r="252" fill="none" stroke="#0a121a" stroke-opacity="0.5" stroke-width="8"/>
</svg>
